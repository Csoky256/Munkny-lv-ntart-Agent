<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1f2733;
    --muted: #6b7686;
    --line: #e3e8ef;
    --brand: #2f6fed;
    --brand-dark: #2256c4;
    --danger: #d9453c;
    --ok: #1f9d63;
    --warn: #e08a00;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px; line-height: 1.45;
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 16px; margin: 0; }

  .topbar {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 10px 16px; position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { font-size: 22px; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }

  main { max-width: 1100px; margin: 0 auto; padding: 16px; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input[type="search"], .toolbar select {
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 14px; background: #fff;
  }
  .toolbar input[type="search"] { flex: 1; min-width: 200px; }
  .chk { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }

  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger.ghost:hover { background: #fdecea; }
  .icon-btn { border: none; background: none; font-size: 18px; cursor: pointer; color: var(--muted); }

  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); }
  .stat .num { font-size: 20px; font-weight: 700; }
  .stat .lbl { color: var(--muted); font-size: 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; box-shadow: var(--shadow); cursor: pointer; transition: transform .05s;
  }
  .card:hover { border-color: #cdd6e4; }
  .card:active { transform: scale(.997); }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
  .card-title { font-weight: 700; font-size: 15px; }
  .card-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .card-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .card-row b { color: var(--ink); font-weight: 600; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .badge {
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: #eef2f8; color: #475467;
  }
  .badge.green { background: #e6f6ee; color: var(--ok); }
  .badge.red { background: #fdecea; color: var(--danger); }
  .badge.amber { background: #fdf2e0; color: var(--warn); }
  .badge.blue { background: #e8f0fe; color: var(--brand); }
  .badge.due { background: #fdecea; color: var(--danger); }
  .badge.soon { background: #fdf2e0; color: var(--warn); }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }

  /* Modál */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(16,24,40,.45);
    display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; z-index: 50; overflow: auto;
  }
  .modal {
    background: #fff; border-radius: 14px; width: 100%; max-width: 720px; box-shadow: 0 12px 40px rgba(16,24,40,.25);
    display: flex; flex-direction: column; max-height: calc(100vh - 48px);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .modal-foot { display: flex; gap: 8px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; padding: 18px; overflow: auto; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; background: #fff;
  }
  .field textarea { min-height: 64px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid #bcd0fb; border-color: var(--brand); }
  .req:after { content: " *"; color: var(--danger); }
  .ms { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 0; }
  .ms label { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; }
  .switch label { color: var(--ink); }

  /* Toast + loader */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1f2733; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px; z-index: 100; box-shadow: var(--shadow);
  }
  .loader { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: none; align-items: center; justify-content: center; z-index: 200; }
  .loader.on { display: flex; }
  .spinner { width: 36px; height: 36px; border: 4px solid #dbe3f0; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .form-grid { grid-template-columns: 1fr; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
